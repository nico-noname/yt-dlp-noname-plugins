name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          zip -r yt_dlp_noname_plugins.zip yt_dlp_plugins

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: yt_dlp_noname_plugins.zip